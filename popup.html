<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inline 訂位快手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">RESERVATION HELPER</p>
        <h1>inline 訂位快手</h1>
        <p class="lead">輸入餐廳與可接受區間，其餘交給訂位助手。</p>
      </header>

      <section class="update-card" role="status" aria-live="polite" aria-atomic="true">
        <span class="update-dot" aria-hidden="true"></span>
        <span class="update-copy"><strong>版本更新</strong><span id="update-mode">正在檢查版本…</span></span>
        <button id="apply-update" class="update-button" type="button" hidden>更新</button>
        <span id="extension-version" class="version-pill">v0.3.0</span>
      </section>

      <form id="reservation-form">
        <section class="form-section">
          <p class="section-label"><span>1</span> 想訂哪裡</p>
          <label>
            餐廳名稱或 inline 訂位網址
            <input id="restaurant-query" autocomplete="off" placeholder="例如：辛殿信義店，或貼上 inline 網址" required />
          </label>
          <p class="helper">輸入名稱會開啟 inline 官方搜尋；同名分店需選一次。</p>
        </section>

        <section class="form-section">
          <p class="section-label"><span>2</span> 可接受條件</p>
          <div class="grid">
            <label>開始日期<input id="date-start" type="date" required /></label>
            <label>結束日期<input id="date-end" type="date" required /></label>
          </div>
          <div class="grid">
            <label>最早時間<input id="time-start" type="time" value="11:30" required /></label>
            <label>最晚時間<input id="time-end" type="time" value="12:30" required /></label>
          </div>
          <div class="grid">
            <label>大人<input id="adults" type="number" min="1" max="20" value="3" required /></label>
            <label>小孩<input id="children" type="number" min="0" max="20" value="0" required /></label>
          </div>
        </section>

        <section class="form-section">
          <p class="section-label"><span>3</span> 訂位資料</p>
          <fieldset>
            <legend>只儲存在這台瀏覽器</legend>
            <input id="contact-name" autocomplete="name" placeholder="訂位姓名" required />
            <input id="contact-phone" type="tel" autocomplete="tel" placeholder="手機號碼" required />
            <input id="contact-email" type="email" autocomplete="email" placeholder="Email（頁面要求時填入）" />
          </fieldset>
        </section>

        <details>
          <summary>排程與進階選項</summary>
          <div class="details-body">
            <div class="grid">
              <label>啟動時間<input id="release-at" type="datetime-local" /></label>
              <label>提前暖機<input id="prep-minutes" type="number" min="0" max="30" value="5" /></label>
            </div>
            <label class="check-row"><input id="auto-submit" type="checkbox" checked />無付款／OTP 時自動送出</label>
          </div>
        </details>

        <div class="actions">
          <button id="open-now" class="primary" type="button">現在開始找位</button>
          <button type="submit">設定排程</button>
        </div>
        <button id="cancel" class="quiet" type="button">取消排程</button>
      </form>

      <section id="status" aria-live="polite" aria-atomic="true"></section>
      <p class="footnote">CAPTCHA 需手動；付款、信用卡與 OTP 會停下讓你確認。</p>
    </main>
    <script src="update-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
