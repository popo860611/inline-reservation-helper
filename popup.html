<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inline 訂位快手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">RESERVATION HELPER</p>
        <h1>inline 訂位快手</h1>
        <p class="lead">開放瞬間帶你到已預填的官方訂位頁。</p>
      </header>

      <form id="reservation-form">
        <label>
          餐廳名稱
          <input id="restaurant-name" autocomplete="off" placeholder="例如：想訂的餐廳" required />
        </label>

        <label>
          inline 訂位網址
          <input id="booking-url" type="url" placeholder="https://inline.app/booking/..." required />
        </label>

        <div class="grid">
          <label>
            用餐日期
            <input id="booking-date" type="date" required />
          </label>
          <label>
            用餐時間
            <input id="booking-time" type="time" required />
          </label>
        </div>

        <label>
          提前暖機（分鐘）
          <input id="prep-minutes" type="number" min="0" max="30" value="5" required />
        </label>

        <div class="grid">
          <label>
            人數
            <input id="adults" type="number" min="1" max="20" value="2" required />
          </label>
          <label>
            訂位開放時間
            <input id="release-at" type="datetime-local" required />
          </label>
        </div>

        <div class="actions">
          <button class="primary" type="submit">儲存並啟用</button>
          <button id="open-now" type="button">現在開啟測試</button>
        </div>
        <button id="cancel" class="quiet" type="button">取消排程</button>
      </form>

      <section id="status" aria-live="polite"></section>
      <p class="footnote">暖機可先確認登入與喚醒瀏覽器；不會自動送出、付款、破解驗證碼或重複刷新。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
