<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inline 訂位快手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">RESERVATION HELPER</p>
        <h1>inline 訂位快手</h1>
        <p class="lead">開放瞬間帶你到已預填的官方訂位頁。</p>
      </header>

      <form id="reservation-form">
        <label>
          餐廳名稱
          <input id="restaurant-name" autocomplete="off" placeholder="例如：想訂的餐廳" required />
        </label>

        <label>
          inline 訂位網址
          <input id="booking-url" type="url" value="https://inline.app/booking/-LDKPhTT6bNhwjRVHpC2/-LDKPhTT6bNhwjRVHpC3" required />
        </label>

        <div class="grid">
          <label>
            固定日期（留白＝隨機）
            <input id="booking-date" type="date" />
          </label>
          <label>
            用餐時間
            <input id="booking-time" type="time" value="12:00" required />
          </label>
        </div>

        <label>
          提前暖機（分鐘）
          <input id="prep-minutes" type="number" min="0" max="30" value="5" required />
        </label>

        <div class="grid">
          <label>
            人數
            <input id="adults" type="number" min="1" max="8" value="3" required />
          </label>
          <label>
            自動啟動時間（排程才填）
            <input id="release-at" type="datetime-local" />
          </label>
        </div>

        <label>
          隨機日期範圍（未來天數）
          <input id="random-days" type="number" min="1" max="60" value="30" required />
        </label>

        <fieldset>
          <legend>聯絡資料（只存在這台瀏覽器）</legend>
          <input id="contact-name" autocomplete="name" placeholder="訂位姓名" />
          <input id="contact-phone" type="tel" autocomplete="tel" placeholder="手機號碼" />
          <input id="contact-email" type="email" autocomplete="email" placeholder="Email（頁面要求時填入）" />
        </fieldset>

        <label class="check-row">
          <input id="auto-submit" type="checkbox" checked />
          無付款／OTP 時自動送出最終訂位
        </label>

        <div class="actions">
          <button class="primary" type="submit">儲存並啟用</button>
          <button id="open-now" type="button">現在啟動自動訂位</button>
        </div>
        <button id="cancel" class="quiet" type="button">取消排程</button>
      </form>

      <section id="status" aria-live="polite"></section>
      <p class="footnote">暖機可先確認登入與喚醒瀏覽器；不會自動送出、付款、破解驗證碼或重複刷新。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
